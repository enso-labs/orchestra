name: orchestra-dev

services:
    backend:
        ports:
            - "5678:5678"
        command:
            [
                "/bin/sh",
                "-lc",
                "uv sync --frozen --dev --extra api --no-install-project && uv run alembic upgrade head && uv run python -m debugpy --listen 0.0.0.0:5678 -m uvicorn main:app --reload --host 0.0.0.0 --port 8000 --log-level debug",
            ]

    worker:
        ports:
            - "5679:5679"
        command:
            [
                "/bin/sh",
                "-lc",
                "uv sync --frozen --dev --extra api --no-install-project && uv run python -m debugpy --listen 0.0.0.0:5679 -m taskiq worker src.workers.tasks:broker",
            ]
