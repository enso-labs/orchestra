name: storage

networks:
    storage:
        name: storage

services:
    postgres:
        image: pgvector/pgvector:pg16
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: test1234
            POSTGRES_MULTIPLE_DATABASES: lg_template_dev,lg_template_test
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - storage
        deploy:
            resources:
                limits:
                    cpus: "2"
                    memory: 2G

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        command: redis-server --appendonly yes
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - storage
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 512M

volumes:
    postgres_data:
    redis_data:
