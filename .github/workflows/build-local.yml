name: Build Local

permissions:
    contents: read
    packages: write

on:
    push:
        tags:
            - "local-*"

jobs:
    build:
        runs-on: ubuntu-latest
        environment: Dev
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Parse tag
              id: parse
              run: |
                  # Expected tag format: local-v1.0.0
                  VERSION=${GITHUB_REF#refs/tags/local-}
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Version: $VERSION"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ secrets.GHCR_USERNAME || github.actor }}
                  password: ${{ secrets.GHCR_PAT }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/Dockerfile
                  push: true
                  tags: |
                      ghcr.io/ruska-ai/orchestra:local-${{ steps.parse.outputs.version }}
                      ghcr.io/ruska-ai/orchestra:local
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
