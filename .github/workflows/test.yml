name: Test

on:
    push:
        branches:
            # Run on pushes to any branch, including namespaced branches like feat/foo.
            - "**"
        paths-ignore:
            - "Changelog.md"
            - "decks/**"
            - "docs/**"
            - "README.md"
            - "deployment/**"
            - "examples/**"
            - "openspec/**"
            - "cli/**"
            - "website/**"
    # Allow a manual re-run. Without this the workflow can only be started by a
    # push that touches a non-ignored path, so a run that fails to acquire a
    # runner cannot be retried without inventing a code change.
    workflow_dispatch:
jobs:
    ###############################################################
    ## Test Frontend
    ###############################################################
    test-frontend:
        runs-on: ubuntu-latest
        environment: Test
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Cache Node dependencies
              id: cache-node
              uses: actions/cache@v4
              with:
                  path: |
                      **/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-

            - name: Install dependencies
              working-directory: ./frontend
              if: steps.cache-node.outputs.cache-hit != 'true'
              run: npm ci

            - name: Save Node dependencies cache
              if: steps.cache-node.outputs.cache-hit != 'true'
              id: save-cache-node
              uses: actions/cache@v4
              with:
                  path: |
                      **/node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

            - name: Run tests
              working-directory: ./frontend
              run: npm test

            - name: Build frontend
              working-directory: ./frontend
              run: npm run build

            - name: Run single-runtime static gate
              working-directory: ./backend
              run: python3 scripts/cutover_static_scan.py

    ###############################################################
    ## Test Backend use Cache
    ###############################################################
    test-backend:
        runs-on: ubuntu-latest
        environment: Test
        env:
            APP_ENV: test
            APP_LOG_LEVEL: debug
            APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
            POSTGRES_CONNECTION_STRING: postgresql://admin:test1234@localhost:5432/lg_template_test
            DATABASE_URL: postgresql://admin:test1234@localhost:5432/lg_template_test
            MIGRATION_DATABASE_NAME: lg_template_test
            AEGRA_CONFIG: ./backend/aegra.json
            RUN_MIGRATIONS_ON_STARTUP: "false"
            OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
            ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        services:
            postgres:
                image: pgvector/pgvector:pg16
                env:
                    POSTGRES_USER: admin
                    POSTGRES_PASSWORD: test1234
                    POSTGRES_DB: lg_template_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            redis:
                image: redis:alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Cache Python dependencies
              id: cache-python
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-

            - name: Install dependencies
              working-directory: ./backend
              run: |
                  env | sort
                  mkdir -p src/public/docs
                  mkdir -p src/public/assets
                  pip install --upgrade pip
                  pip install uv
                  uv sync --frozen --no-cache --dev

            - name: Save Python dependencies cache
              if: steps.cache-python.outputs.cache-hit != 'true'
              id: save-cache-python
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}

            - name: Wait for PostgreSQL
              run: |
                  timeout 30 bash -c 'until pg_isready -h localhost -p 5432 -U admin; do sleep 1; done'

            - name: Run ordered migration preflight
              working-directory: ./backend
              env:
                  PYTHONPATH: ./src:.
                  DATABASE_URL: postgresql://admin:test1234@localhost:5432/lg_template_test
                  MIGRATION_DATABASE_NAME: lg_template_test
                  AEGRA_CONFIG: ./aegra.json
                  RUN_MIGRATIONS_ON_STARTUP: "false"
              run: |
                  uv run python scripts/migrate.py

            - name: Run Python compile and lint gates
              working-directory: ./backend
              env:
                  PYTHONPATH: ./src:.
              run: |
                  uv run python -m compileall -q src scripts migrations main.py
                  uv run ruff check

            - name: Run tests
              working-directory: ./backend
              env:
                  PYTHONPATH: ./src:.
              run: |
                  # Create a scratch database directory (tests run against the CI postgres service)
                  mkdir -p ./.test-data/postgres
                  # Run your tests
                  uv run pytest -rs

    ###############################################################
    ## E2E Tests (Playwright) — blocking single-runtime smoke gate
    ###############################################################
    test-e2e:
        runs-on: ubuntu-latest
        environment: Test
        env:
            APP_ENV: test
            APP_LOG_LEVEL: debug
            APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
            POSTGRES_CONNECTION_STRING: postgresql://admin:test1234@localhost:5432/lg_template_test
            OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
            ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
            DATABASE_URL: postgresql://admin:test1234@localhost:5432/lg_template_test
            MIGRATION_DATABASE_NAME: lg_template_test
            AEGRA_CONFIG: ./backend/aegra.json
            RUN_MIGRATIONS_ON_STARTUP: "false"
        services:
            postgres:
                image: pgvector/pgvector:pg16
                env:
                    POSTGRES_USER: admin
                    POSTGRES_PASSWORD: test1234
                    POSTGRES_DB: lg_template_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            redis:
                image: redis:alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install Python dependencies
              working-directory: ./backend
              run: |
                  mkdir -p src/public/docs
                  mkdir -p src/public/assets
                  pip install --upgrade pip
                  pip install uv
                  uv sync --frozen --no-cache --dev

            - name: Wait for PostgreSQL
              run: |
                  timeout 30 bash -c 'until pg_isready -h localhost -p 5432 -U admin; do sleep 1; done'

            - name: Run ordered migration preflight
              working-directory: ./backend
              env:
                  PYTHONPATH: ./src:.
                  DATABASE_URL: postgresql://admin:test1234@localhost:5432/lg_template_test
                  MIGRATION_DATABASE_NAME: lg_template_test
                  AEGRA_CONFIG: ./aegra.json
                  RUN_MIGRATIONS_ON_STARTUP: "false"
              run: |
                  uv run python scripts/migrate.py

            - name: Seed default user
              working-directory: ./backend
              env:
                  PYTHONPATH: ./src:.
              run: uv run python -m seeds.user_seeder

            - name: Install frontend dependencies
              working-directory: ./frontend
              run: npm ci

            - name: Install Playwright browsers
              working-directory: ./frontend
              run: npx playwright install --with-deps chromium

            - name: Start single Aegra API
              working-directory: ./backend
              env:
                  PYTHONPATH: ./src:.
                  AEGRA_CONFIG: ./aegra.json
                  RUN_MIGRATIONS_ON_STARTUP: "false"
              run: |
                  uv run --python 3.12 uvicorn aegra_api.main:app --host 0.0.0.0 --port 8000 &
                  echo "API_PID=$!" >> "$GITHUB_ENV"
                  timeout 60 bash -c 'until curl -sf http://localhost:8000/health && curl -sf http://localhost:8000/api/info/health; do sleep 2; done'

            - name: Start frontend dev server
              working-directory: ./frontend
              run: |
                  # Pre-bundle deps so the first spec doesn't pay Vite's cold optimize cost.
                  npx vite optimize --force
                  VITE_API_URL=http://localhost:8000/api npx vite --port 5173 --host 0.0.0.0 &
                  echo "VITE_PID=$!" >> "$GITHUB_ENV"
                  # Wait for Vite to be ready; failure must block the browser gate.
                  timeout 60 bash -c 'until curl -sf http://localhost:5173 >/dev/null; do sleep 2; done'
                  # Warm the full module graph in a real browser so the first blocking
                  # Playwright spec finds a hot dev server.
                  node -e "const {chromium}=require('@playwright/test');(async()=>{const b=await chromium.launch();const p=await b.newPage();await p.goto('http://localhost:5173/chat',{waitUntil:'networkidle',timeout:90000});await b.close();})()"

            - name: Run Playwright E2E specs
              working-directory: ./frontend
              run: npx playwright test

            - name: Upload Playwright artifacts
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: playwright-artifacts
                  path: frontend/e2e/.artifacts/**
                  retention-days: 7
