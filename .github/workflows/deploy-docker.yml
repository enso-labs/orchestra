name: Deploy-Docker

permissions:
    contents: read
    packages: read

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag to deploy (for example agent-v1.0.0-rc1)"
                required: true
                type: string

jobs:
    deploy:
        runs-on: ubuntu-latest
        if: ${{ contains(inputs.tag, 'rc') }}
        environment: Dev
        steps:
            - name: Deploy single Aegra API to VM
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
                  SSH_HOST: ${{ secrets.SSH_HOST }}
                  SSH_USER: ${{ secrets.SSH_USER }}
                  GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
                  GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
                  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/orchestra-api
              run: |
                  set -eu
                  mkdir -p ~/.ssh
                  printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan github.com >> ~/.ssh/known_hosts
                  ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
                  TAG=${{ inputs.tag }}

                  ssh -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" "
                    set -e
                    cd ~/agent_api
                    echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin
                    docker pull $GHCR_IMAGE:$TAG

                    echo '--- Running ordered migration/preflight init ---'
                    docker run --rm \
                      --name graphchat_migrate \
                      --network graphchat_default \
                      --env-file ./backend/.env \
                      -e RUN_MIGRATIONS_ON_STARTUP=false \
                      $GHCR_IMAGE:$TAG \
                      python -B scripts/migrate.py

                    echo '--- Starting staging API on port 8006 ---'
                    docker stop graphchat_new 2>/dev/null || true
                    docker rm graphchat_new 2>/dev/null || true
                    docker run -d \
                      --name graphchat_new \
                      --network graphchat_default \
                      --env-file ./backend/.env \
                      -e RUN_MIGRATIONS_ON_STARTUP=false \
                      -p 8006:8000 \
                      $GHCR_IMAGE:$TAG

                    for i in {1..6}; do
                      if curl -f http://localhost:8006/health && curl -f http://localhost:8006/api/info/health; then
                        echo 'Staging Aegra/custom health checks passed.'
                        break
                      fi
                      if [ \$i -eq 6 ]; then
                        docker logs graphchat_new
                        exit 1
                      fi
                      sleep 10
                    done

                    docker stop graphchat || true
                    docker rm graphchat || true
                    docker stop graphchat_new 2>/dev/null || true
                    docker rm graphchat_new 2>/dev/null || true

                    echo '--- Starting single production API on port 8000 ---'
                    docker run -d \
                      --name graphchat \
                      --network graphchat_default \
                      --restart always \
                      --env-file ./backend/.env \
                      -e APP_VERSION=$TAG \
                      -e VITE_APP_VERSION=$TAG \
                      -e RUN_MIGRATIONS_ON_STARTUP=false \
                      -p 8000:8000 \
                      $GHCR_IMAGE:$TAG

                    for i in {1..6}; do
                      if curl -f http://localhost:8000/health && curl -f http://localhost:8000/api/info/health; then
                        echo 'Production Aegra/custom health checks passed.'
                        break
                      fi
                      if [ \$i -eq 6 ]; then
                        docker logs graphchat
                        exit 1
                      fi
                      sleep 10
                    done

                    docker network connect graphchat_default redis7 2>/dev/null || true
                    docker system prune -a --filter 'until=1h' -f
                    echo 'Single Aegra API deployment successful.'
                  "
