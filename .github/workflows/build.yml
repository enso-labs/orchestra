name: Build

permissions:
    contents: read
    packages: write

on:
    push:
        tags:
            - "*"

jobs:
    build:
        runs-on: ubuntu-latest
        environment: Dev
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            ###############################################################
            ## Frontend
            ###############################################################
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install frontend dependencies
              working-directory: ./frontend
              run: npm ci

            - name: Create public directory
              working-directory: ./backend
              run: mkdir -p src/public

            - name: Build frontend
              working-directory: ./frontend
              run: npm run build

            ###############################################################
            ## Backend
            ###############################################################
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Cache Python dependencies
              id: cache-python
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-

            - name: Install dependencies
              working-directory: ./backend
              run: |
                  pip install --upgrade pip
                  pip install uv
                  uv sync --frozen --no-cache --no-dev

            - name: Copy Docker README and LICENSE to backend
              run: |
                  cp infra/README.md backend/README.md
                  cp LICENSE backend/LICENSE

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ secrets.GHCR_USERNAME || github.actor }}
                  password: ${{ secrets.GHCR_PAT }}

            - name: Build and push single Aegra API image
              working-directory: ./backend
              run: |
                  TAG=${GITHUB_REF#refs/tags/}
                  docker build --target api -f ../infra/backend.Dockerfile \
                    -t ghcr.io/ruska-ai/orchestra-api:$TAG \
                    -t ghcr.io/ruska-ai/orchestra-api:latest \
                    -t ghcr.io/ruska-ai/orchestra:$TAG \
                    -t ghcr.io/ruska-ai/orchestra:latest \
                    .
                  docker push ghcr.io/ruska-ai/orchestra-api:$TAG
                  docker push ghcr.io/ruska-ai/orchestra-api:latest
                  docker push ghcr.io/ruska-ai/orchestra:$TAG
                  docker push ghcr.io/ruska-ai/orchestra:latest

            - name: Report image size
              run: |
                  echo "## Docker Image Sizes" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "| Image | Size |" >> "$GITHUB_STEP_SUMMARY"
                  echo "|-------|------|" >> "$GITHUB_STEP_SUMMARY"
                  docker images ghcr.io/ruska-ai/orchestra-api --format "| API | {{.Size}} |" | head -1 >> "$GITHUB_STEP_SUMMARY"

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment: Dev
        steps:
            - name: Deploy single Aegra API to VM
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
                  SSH_HOST: ${{ secrets.SSH_HOST }}
                  SSH_USER: ${{ secrets.SSH_USER }}
                  GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
                  GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
                  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/orchestra-api
              run: |
                  set -eu
                  mkdir -p ~/.ssh
                  printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan github.com >> ~/.ssh/known_hosts
                  ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
                  TAG=${GITHUB_REF#refs/tags/}

                  ssh -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" "
                    set -e
                    cd ~/agent_api
                    echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin
                    docker pull $GHCR_IMAGE:$TAG

                    echo '--- Running ordered migration/preflight init ---'
                    docker run --rm \
                      --name graphchat_migrate \
                      --network graphchat_default \
                      --env-file ./backend/.env \
                      -e RUN_MIGRATIONS_ON_STARTUP=false \
                      $GHCR_IMAGE:$TAG \
                      python -B scripts/migrate.py

                    echo '--- Starting staging API on port 8006 ---'
                    docker stop graphchat_new 2>/dev/null || true
                    docker rm graphchat_new 2>/dev/null || true
                    docker run -d \
                      --name graphchat_new \
                      --network graphchat_default \
                      --env-file ./backend/.env \
                      -e RUN_MIGRATIONS_ON_STARTUP=false \
                      -p 8006:8000 \
                      $GHCR_IMAGE:$TAG

                    for i in {1..6}; do
                      if curl -f http://localhost:8006/health && curl -f http://localhost:8006/api/info/health; then
                        echo 'Staging Aegra/custom health checks passed.'
                        break
                      fi
                      if [ \$i -eq 6 ]; then
                        docker logs graphchat_new
                        exit 1
                      fi
                      sleep 10
                    done

                    docker stop graphchat || true
                    docker rm graphchat || true
                    docker stop graphchat_new 2>/dev/null || true
                    docker rm graphchat_new 2>/dev/null || true

                    echo '--- Starting single production API on port 8000 ---'
                    docker run -d \
                      --name graphchat \
                      --network graphchat_default \
                      --restart always \
                      --env-file ./backend/.env \
                      -e APP_VERSION=$TAG \
                      -e VITE_APP_VERSION=$TAG \
                      -e RUN_MIGRATIONS_ON_STARTUP=false \
                      -p 8000:8000 \
                      $GHCR_IMAGE:$TAG

                    for i in {1..6}; do
                      if curl -f http://localhost:8000/health && curl -f http://localhost:8000/api/info/health; then
                        echo 'Production Aegra/custom health checks passed.'
                        break
                      fi
                      if [ \$i -eq 6 ]; then
                        docker logs graphchat
                        exit 1
                      fi
                      sleep 10
                    done

                    docker network connect graphchat_default redis7 2>/dev/null || true
                    docker system prune -a --filter 'until=1h' -f
                    echo 'Single Aegra API deployment successful.'
                  "
