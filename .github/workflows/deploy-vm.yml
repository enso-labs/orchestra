name: Deploy-Aegra-VM

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag to deploy (for example agent-v1.0.0-rc1)"
                required: true
                type: string

jobs:
    deploy:
        runs-on: ubuntu-latest
        if: ${{ contains(inputs.tag, 'agent') }}
        environment: Dev
        steps:
            - name: Deploy single Aegra API runtime
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
                  SSH_HOST: ${{ secrets.SSH_HOST }}
                  SSH_USER: ${{ secrets.SSH_USER }}
              run: |
                  set -eu
                  mkdir -p ~/.ssh
                  printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan github.com >> ~/.ssh/known_hosts
                  ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
                  TAG=${{ inputs.tag }}

                  ssh -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" "
                    set -e
                    cd ~/agent_api
                    git fetch --all --tags
                    git checkout ${TAG} -f

                    tmux ls 2>/dev/null | grep '^agent_api' | cut -d: -f1 | xargs -r -I{} tmux kill-session -t {}
                    SESSION_NAME=agent_api_${TAG}
                    tmux new-session -d -s \"\${SESSION_NAME}\" '
                      set -eu
                      cd ~/agent_api/backend
                      uv python install 3.12
                      uv sync --frozen --no-cache --no-dev --python 3.12
                      export APP_VERSION=${TAG}
                      export APP_USER_LIST=${{ secrets.APP_USER_LIST }}
                      export ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
                      export OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
                      export POSTGRES_CONNECTION_STRING=${{ secrets.POSTGRES_CONNECTION_STRING }}
                      export DATABASE_URL=\"\${DATABASE_URL:-\${POSTGRES_CONNECTION_STRING}}\"
                      export MIGRATION_DATABASE_NAME=\"\${MIGRATION_DATABASE_NAME:-}\"
                      export AEGRA_CONFIG=\"\${PWD}/aegra.json\"
                      export RUN_MIGRATIONS_ON_STARTUP=false
                      export REDIS_URL=\"\${REDIS_URL:-redis://localhost:6379/0}\"
                      export REDIS_BROKER_ENABLED=true
                      uv run --python 3.12 python scripts/migrate.py
                      exec uv run --python 3.12 uvicorn aegra_api.main:app --host 0.0.0.0 --port 8000 --log-level info
                    '

                    echo \"Single Aegra API started in session: \${SESSION_NAME}\"
                  "
