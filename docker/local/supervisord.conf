[supervisord]
nodaemon=false
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgresql]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/16/main -c config_file=/etc/postgresql/16/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql-error.log

[program:redis]
command=/usr/bin/redis-server --daemonize no --appendonly yes
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis-error.log

[program:orchestra]
command=/app/backend/.venv/bin/python -m uvicorn main:app --host 0.0.0.0 --port 8000 --env-file /root/.env/orchestra/.env.backend.local
directory=/app/backend
autostart=true
autorestart=true
priority=30
startsecs=10
startretries=3
stdout_logfile=/var/log/supervisor/orchestra.log
stderr_logfile=/var/log/supervisor/orchestra-error.log
environment=HOME="/root",PATH="/app/backend/.venv/bin:/usr/local/bin:/usr/bin:/bin"
