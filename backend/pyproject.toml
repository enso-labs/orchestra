[project]
name = "orchestra-api"
version = "4.0.0"
description = "Add your description here"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "alembic>=1.16.5",
    "apscheduler==3.11.0",
    "asyncpg>=0.30.0",
    "authlib>=1.6.3",
    "bs4>=0.0.2",
    "cryptography>=45.0.7",
    "deepagents==0.3.8",
    "fastapi>=0.116.1",
    "langchain-sandbox>=0.0.3", # TODO: Update to 0.0.6 when langchain-core>=1.0 is released
    "langchain[aws]>=1.2.0",
    "langchain-anthropic>=1.3.0",
    # "langchain-arcade>=1.3.1",
    "langchain-community>=0.4.1",
    "langchain-google-genai>=4.1.2",
    "langchain-groq>=1.1.1",
    "langchain-mcp-adapters>=0.2.1",
    "langchain-ollama>=0.3.7",
    "langchain-openai>=1.1.6",
    "langchain-tavily>=0.2.16",
    "langchain-xai>=1.1.0",
    "langgraph==1.0.7",
    "langgraph-checkpoint-postgres>=3.0.2",
    "langmem==0.0.30",
    "loguru>=0.7.3",
    "lxml>=6.0.2",
    "markitdown>=0.1.3",
    "minio>=7.2.16",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.18",
    "mkdocstrings[python]>=0.30.0",
    "nest-asyncio>=1.6.0",
    "passlib[argon2]>=1.7.4",
    "plotly>=6.3.1",
    "polars>=1.35.2",
    "psycopg2-binary>=2.9.10",
    "psycopg[binary,pool]>=3.2.9",
    "pydantic[email]>=2.11.7",
    "pypdf>=6.0.0",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.20",
    # "rapidocr-onnxruntime>=1.4.4", # TODO: No sure if we need this
    "slowapi>=0.1.9", # Rate Limiter
    "sqlalchemy>=2.0.43",
    "tabulate>=0.9.0",
    "ujson>=5.11.0",
    "uvicorn>=0.35.0",
    "yfinance>=0.2.66",
    "fastapi-cache2>=0.2.2",
    "fastmcp>=2.14.1",
    "taskiq-redis>=1.0.0",
    "redis>=5.0.0",
]

[dependency-groups]
dev = [
    "faker>=37.6.0",
    "fakeredis>=2.26.0",
    "ipykernel>=7.1.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-mock>=3.14.0",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*"
]
