site_name: Enso Labs - Orchestra 🪶
site_dir: src/public/docs
docs_dir: ../docs
use_directory_urls: false
nav:
    - Home: index.md
    - Getting Started: getting-started.md
    - Core Features:
          - Assistants:
                - Overview: assistants/index.md
                - API Reference: /api#/Assistant
          - Threads:
                - Overview: threads/index.md
                - API Reference: /api#/Thread
          - Storage:
                - Overview: storage/index.md
                - API Reference: /api#/Storage
          - Projects:
                - API Reference: /api#/Project
          - Prompts:
                - API Reference: /api#/Prompt
    - Tools & Integrations:
          - Overview: tools/tools.md
          - Search: tools/search.md
          - MCP: tools/mcp.md
          - A2A: tools/a2a.md
    - API Documentation: /api
theme:
    name: material
    features:
        - navigation.tabs
        - navigation.sections
        - navigation.top
        - search.highlight
        - search.share
        - mkdocstrings
    palette:
        - scheme: default
          primary: black
          accent: black
          toggle:
              icon: material/brightness-7
              name: Switch to dark mode
        - scheme: slate
          primary: white
          accent: white
          toggle:
              icon: material/brightness-4
              name: Switch to light mode
markdown_extensions:
    - pymdownx.highlight:
          anchor_linenums: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences
    - admonition
    - pymdownx.details
    - pymdownx.tabbed:
          alternate_style: true
    - attr_list
    - md_in_html
    - def_list
    - footnotes
    - tables
    - toc:
          permalink: true
          toc_depth: 3

# Site metadata
site_url: https://orchestra.enso.sh
site_description: Composable AI Agent Infrastructure built on LangGraph with MCP & A2A protocol support
site_author: Enso Labs

# Copyright
copyright: Copyright &copy; 2025 Enso Labs. All rights reserved.

extra:
    base_url: "/docs/"
    homepage: /
    social:
        - icon: fontawesome/brands/discord
          link: https://discord.com/invite/QRfjg4YNzU
          name: Join our Discord
        - icon: fontawesome/brands/github
          link: https://github.com/ruska-ai
          name: Enso Labs on GitHub
        - icon: fontawesome/solid/link
          link: https://enso.sh/socials
          name: Follow us on social media
