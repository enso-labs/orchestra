services:
    ##############################################
    ## Database (Postgres)
    ##############################################
    postgres:
        image: pgvector/pgvector:pg16
        container_name: postgres
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: test1234
            POSTGRES_MULTIPLE_DATABASES: "lg_template_dev,lg_template_test"
        ports:
            - "5432:5432"
        volumes:
            - ./docker/postgres/data:/var/lib/postgresql/data
            - ./docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh

    ##############################################
    ## Redis (Message Broker for Distributed Workers)
    ##############################################
    redis:
        image: redis:7-alpine
        container_name: redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        command: redis-server --appendonly yes
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    ##############################################
    ## TaskIQ Worker (Distributed Agent Execution)
    ##############################################
    worker:
        build:
            context: ./backend
            dockerfile: Dockerfile
            target: worker
        environment:
            - REDIS_URL=redis://redis:6379/0
            - DISTRIBUTED_WORKERS=true
        depends_on:
            redis:
                condition: service_healthy
            postgres:
                condition: service_started
        deploy:
            replicas: 1
            resources:
                limits:
                    cpus: '1.0'
                    memory: 1G
                reservations:
                    cpus: '0.25'
                    memory: 256M
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "pgrep", "-f", "taskiq"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s

    ##############################################
    ## Minio (File Storage)
    ##############################################
    minio:
        image: minio/minio
        container_name: minio
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            MINIO_ROOT_USER: CHANGEME
            MINIO_ROOT_PASSWORD: CHANGEME
        volumes:
            - ~/minio/data:/data
            - ~/minio/config:/root/.minio
        command: server /data --console-address ":9001"

    ##############################################
    ## Slack Agent
    ##############################################
