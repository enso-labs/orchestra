services:
    ##############################################
    ## Database (Postgres)
    ##############################################
    postgres:
        image: pgvector/pgvector:pg16
        container_name: postgres
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: test1234
            POSTGRES_MULTIPLE_DATABASES: "lg_template_dev,lg_template_test"
        ports:
            - "5432:5432"
        volumes:
            - ./docker/postgres/data:/var/lib/postgresql/data
            - ./docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh

    pgadmin:
        image: dpage/pgadmin4
        container_name: pgadmin
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@example.com
            PGADMIN_DEFAULT_PASSWORD: test1234
        ports:
            - "4040:80"
        volumes:
            - ./docker/pgadmin/servers.json:/pgadmin4/servers.json
        depends_on:
            - postgres

    ##############################################
    ## Redis (Message Broker for Distributed Workers)
    ##############################################
    redis:
        image: redis:7-alpine
        container_name: redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        command: redis-server --appendonly yes
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    ##############################################
    ## TaskIQ Worker (Distributed Agent Execution)
    ##############################################
    # worker:
    #     build:
    #         context: ./backend
    #         dockerfile: Dockerfile
    #     container_name: orchestra_worker
    #     env_file:
    #         - ./backend/.env.docker
    #     environment:
    #         - REDIS_URL=redis://redis:6379/0
    #         - DISTRIBUTED_WORKERS=true
    #     command: uv run taskiq worker src.workers.tasks:broker
    #     depends_on:
    #         redis:
    #             condition: service_healthy
    #         postgres:
    #             condition: service_started
    #     deploy:
    #         replicas: 2  # Horizontal scaling
    #     restart: unless-stopped

    ##############################################
    ## Minio (File Storage)
    ##############################################
    minio:
        image: minio/minio
        container_name: minio
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            MINIO_ROOT_USER: CHANGEME
            MINIO_ROOT_PASSWORD: CHANGEME
        volumes:
            - ~/minio/data:/data
            - ~/minio/config:/root/.minio
        command: server /data --console-address ":9001"

    ##############################################
    ## Slack Agent
    ##############################################
    # slack_agent:
    #   container_name: slack_agent
    #   image: ryaneggz/slack-agent:latest
    #   env_file: .env.slack
    #   network_mode: host
    #   restart: always

    ##############################################
    ## Graphchat
    ##############################################
    # orchestra:
    #     # image: ryaneggz/graphchat:0.0.2-rc108
    #     build:
    #         context: ./backend
    #         dockerfile: Dockerfile
    #     container_name: orchestra
    #     env_file:
    #         - ./backend/.env.docker
    #     ports:
    #         - "8000:8000"
    #     depends_on:
    #         - postgres

    ##############################################
    ## Ollama (AI Service)
    ##############################################
    ollama:
        image: ollama/ollama
        container_name: ollama
        runtime: nvidia
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          capabilities: [gpu]
        volumes:
            - ollama:/root/.ollama
        ports:
            - "11434:11434"
        # command: >
        #   sh -c "
        #     ollama pull qwen3-vl gemma3 &&
        #     tail -f /dev/null
        #   "

    ##############################################
    ## Exec Server
    ##############################################
    exec_server:
        build:
            context: ./docker/ubuntu
            dockerfile: Dockerfile
        container_name: exec_server
        ports:
            - "3005:3005"
        volumes:
            - ${HOME}/.ssh:/root/.ssh:ro

    ##############################################
    ## Search Engine
    ##############################################
    search_engine:
        image: searxng/searxng
        container_name: search_engine
        ports:
            - "8080:8080"
        volumes:
            - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
        environment:
            SEARXNG_SETTINGS_PATH: "/etc/searxng/settings.yml"

volumes:
    ollama:
    redis_data:
