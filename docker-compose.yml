    #   container_name: slack_agent
    #   image: ryaneggz/slack-agent:latest
    #   env_file: .env.slack
    #   network_mode: host
    #   restart: always

    ##############################################
    ## Graphchat
    ##############################################
    # orchestra:
    #     # image: ryaneggz/graphchat:0.0.2-rc108
    #     build:
    #         context: ./backend
    #         dockerfile: Dockerfile
    #     container_name: orchestra
    #     env_file:
    #         - ./backend/.env.docker
    #     ports:
    #         - "8000:8000"
    #     depends_on:
    #         - postgres

    ##############################################
    ## Ollama (AI Service)
    ##############################################
    ollama:
        image: ollama/ollama
        container_name: ollama
        runtime: nvidia
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          capabilities: [gpu]
        volumes:
            - ollama:/root/.ollama
        ports:
            - "11434:11434"
        # command: >
        #   sh -c "
        #     ollama pull qwen3-vl gemma3 &&
        #     tail -f /dev/null
        #   "

    ##############################################
    ## Search Engine
    ##############################################
    search_engine:
        image: searxng/searxng
        container_name: search_engine
        ports:
            - "8080:8080"
        volumes:
            - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
        environment:
            SEARXNG_SETTINGS_PATH: "/etc/searxng/settings.yml"

volumes:
    ollama:
    redis_data:
