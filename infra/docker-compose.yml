name: orchestra

services:
    ##############################################
    ## Database (Postgres)
    ##############################################
    postgres:
        image: pgvector/pgvector:pg16
        container_name: postgres
        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: test1234
            POSTGRES_MULTIPLE_DATABASES: "lg_template_dev,lg_template_test"
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
            interval: 10s
            timeout: 5s
            retries: 5
        deploy:
            resources:
                limits:
                    cpus: "2"
                    memory: 2G

    ##############################################
    ## Redis (Message Broker for Distributed Workers)
    ##############################################
    redis:
        image: redis:7-alpine
        container_name: redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        command: redis-server --appendonly yes
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 512M

    ##############################################
    ## Minio (File Storage)
    ##############################################
    minio:
        image: minio/minio
        container_name: minio
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            MINIO_ROOT_USER: CHANGEME
            MINIO_ROOT_PASSWORD: CHANGEME
        volumes:
            - minio_data:/data
        command: server /data --console-address ":9001"

    ##############################################
    ## Ollama (AI Service)
    ##############################################
    ollama:
        image: ollama/ollama
        container_name: ollama
        runtime: nvidia
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          capabilities: [gpu]
        ports:
            - "11434:11434"
        entrypoint: ["/bin/bash", "/entrypoint.sh"]
        volumes:
            - ollama:/root/.ollama
            - ./ollama/entrypoint.sh:/entrypoint.sh:ro

    ##############################################
    ## Search Engine (SearXNG)
    ##############################################
    search_engine:
        image: searxng/searxng
        container_name: search_engine
        ports:
            - "8080:8080"
        volumes:
            - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
            - ./searxng/uwsgi.ini:/etc/searxng/uwsgi.ini:ro
        environment:
            SEARXNG_SETTINGS_PATH: "/etc/searxng/settings.yml"
        deploy:
            resources:
                limits:
                    cpus: "1"
                    memory: 1G

    ##############################################
    ## App (FastAPI Backend — api target)
    ##############################################
    app:
        build:
            context: ../backend
            dockerfile: ../infra/backend.Dockerfile
            target: api
        image: ghcr.io/ruska-ai/orchestra-api:local
        working_dir: /app
        init: true
        env_file:
            - ~/.config/orchestra/.env
        environment:
            APP_ENV: development
            APP_LOG_LEVEL: DEBUG
            POSTGRES_CONNECTION_STRING: "postgresql://admin:test1234@postgres:5432/lg_template_dev"
            REDIS_URL: redis://redis:6379/0
            SEARX_SEARCH_HOST_URL: http://search_engine:8080
            DISTRIBUTED_WORKERS: "true"
        ports:
            - "8000:8000"
        volumes:
            - ../backend:/app
            - backend_venv:/app/.venv
            - backend_uv_cache:/root/.cache/uv
        extra_hosts:
            - host.docker.internal:host-gateway
        command:
            [
                "/bin/sh",
                "-lc",
                "uv sync --frozen --dev --no-install-project && uv run alembic upgrade head && uv run uvicorn main:app --reload --host 0.0.0.0 --port 8000 --log-level debug",
            ]
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/info/health', timeout=5).read()",
                ]
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 45s
        deploy:
            resources:
                limits:
                    cpus: "2"
                    memory: 2G

    ##############################################
    ## Worker (TaskIQ — worker target)
    ##############################################
    worker:
        build:
            context: ../backend
            dockerfile: ../infra/backend.Dockerfile
            target: worker
        working_dir: /app
        init: true
        env_file:
            - ~/.config/orchestra/.env
        environment:
            APP_ENV: development
            APP_LOG_LEVEL: DEBUG
            POSTGRES_CONNECTION_STRING: "postgresql://admin:test1234@postgres:5432/lg_template_dev"
            REDIS_URL: redis://redis:6379/0
            DISTRIBUTED_WORKERS: "true"
        volumes:
            - ../backend:/app
            - backend_venv:/app/.venv
            - backend_uv_cache:/root/.cache/uv
        extra_hosts:
            - host.docker.internal:host-gateway
        command:
            [
                "/bin/sh",
                "-lc",
                "uv sync --frozen --dev --no-install-project && uv run taskiq worker src.workers.tasks:broker",
            ]
        depends_on:
            redis:
                condition: service_healthy
            postgres:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "pgrep", "-f", "taskiq"]
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 30s
        deploy:
            resources:
                limits:
                    cpus: "2"
                    memory: 2G

volumes:
    postgres_data:
    redis_data:
    minio_data:
    ollama:
    backend_venv:
    backend_uv_cache:
