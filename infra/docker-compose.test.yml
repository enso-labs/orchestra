# Thin test overlay — layer on top of the single-runtime stack:
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.test.yml up -d
#   (or: make dev.docker.test.up)
#
# The overlay points both the migration init service and the Aegra API at the
# dedicated test database. It does not add another Postgres or API service.
services:
    migrate:
        environment:
            APP_ENV: test
            POSTGRES_CONNECTION_STRING: "postgresql://admin:test1234@postgres:5432/lg_template_test"
            DATABASE_URL: "postgresql://admin:test1234@postgres:5432/lg_template_test"
            MIGRATION_DATABASE_NAME: lg_template_test
            REDIS_URL: redis://redis:6379/0

    app:
        environment:
            APP_ENV: test
            POSTGRES_CONNECTION_STRING: "postgresql://admin:test1234@postgres:5432/lg_template_test"
            DATABASE_URL: "postgresql://admin:test1234@postgres:5432/lg_template_test"
            MIGRATION_DATABASE_NAME: lg_template_test
            REDIS_URL: redis://redis:6379/0
            RUN_MIGRATIONS_ON_STARTUP: "false"
