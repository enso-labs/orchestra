# Thin test overlay — layer on top of the default stack:
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.test.yml up -d
#   (or: make dev.docker.test.up)
#
# Overrides only the env needed to run against the dedicated `lg_template_test`
# database. The default file already provisions both `lg_template_dev` and
# `lg_template_test` via POSTGRES_MULTIPLE_DATABASES, so no schema service is
# redefined here — this stays an override, not a second stack.
#
# Note: CI (.github/workflows/test.yml) runs pytest against GitHub service
# containers, NOT this overlay; this file is for local end-to-end test runs.
services:
    app:
        environment:
            APP_ENV: test
            POSTGRES_CONNECTION_STRING: "postgresql://admin:test1234@postgres:5432/lg_template_test"
            REDIS_URL: redis://redis:6379/0

    worker:
        environment:
            APP_ENV: test
            DISTRIBUTED_WORKERS: "true"
            POSTGRES_CONNECTION_STRING: "postgresql://admin:test1234@postgres:5432/lg_template_test"
            REDIS_URL: redis://redis:6379/0
