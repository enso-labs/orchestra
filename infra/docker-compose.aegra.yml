# Stage-1 Aegra sidecar (US-003).
#
# ADDITIVE ONLY. infra/docker-compose.yml is not modified by this story.
# Merge both files:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.aegra.yml up -d aegra
# or use `make dev.aegra.up`.
#
# This serves NO traffic. It exists so stages 2-5 have something real to be
# validated against, and it is deleted at stage 6 when Aegra takes over :8000.
# It runs against `orchestra_aegra` -- a COPY of the dev database. Two stacks,
# two databases. Never two stacks sharing one.

name: orchestra

services:
    aegra:
        build:
            context: ..
            dockerfile: infra/aegra.Dockerfile
            args:
                AEGRA_VERSION: "0.9.25"
        image: orchestra-aegra:0.9.25
        container_name: aegra
        ports:
            # 2026 only. :5173 and :8000 belong to the operator's live stack.
            - "2026:2026"
        environment:
            # The copy database, NOT lg_template_dev. Same credentials as the
            # rest of this compose project (dev-only, already committed there).
            POSTGRES_CONNECTION_STRING: "postgresql://admin:test1234@postgres:5432/orchestra_aegra"
            DATABASE_URL: "postgresql://admin:test1234@postgres:5432/orchestra_aegra"
            AEGRA_CONFIG: /app/aegra.json
        volumes:
            # Bind-mounted so the sidecar tracks the working tree without a rebuild.
            - ../aegra.json:/app/aegra.json:ro
            - ../infra/aegra:/app/infra/aegra:ro
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:2026/health')\""]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
